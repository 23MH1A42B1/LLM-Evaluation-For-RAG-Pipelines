version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: qdrant_rag_eval
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  eval-harness:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_regression_harness
    environment:
      - VECTOR_DB_HOST=qdrant
      - VECTOR_DB_PORT=6333
      - VECTOR_DB_URL=http://qdrant:6333
      - OPENAI_API_KEY=${OPENAI_API_KEY:-mock-eval-mode}
      - LLM_JUDGE_MODEL=gpt-4o-mini-2024-07-18
    volumes:
      - ./results:/app/results
      - ./dataset:/app/dataset
      - ./config:/app/config
      - ./prompts:/app/prompts
    depends_on:
      qdrant:
        condition: service_healthy
    command: ["python", "run_eval.py"]

volumes:
  qdrant_storage:
